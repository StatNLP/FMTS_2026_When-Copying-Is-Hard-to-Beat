    mimic_iv: labevents itemids 51002 (empty) + 52642 (670 rows, mostly pre-ICU)
    hirid: null
    eicu: lab labname "troponin - I"
    umm: l_troponin_i
  note_mimic_iv: >
    MIMIC-IV TnI mapping points at 52642 (the active v3.1 itemid; 51002 has 0
    rows). However the 670 measurements are mostly drawn in the emergency
    department BEFORE ICU admission, so they fall outside the ICU stay window
    used by the Stage-1 cohort filter — Stage-1 output ends up empty for the
    qualifying cohort. The cardiac surveillance during ICU is via Troponin T
    (see troponin_t feature, ~23 % coverage on the same cohort).
  note: >
    HiRID measures Troponin T (cardiac), not Troponin I — see troponin_t.
    The two assays are not interchangeable (different proteins, different
    reference ranges, different units in some labs).


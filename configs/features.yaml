  note: Distinct from the time-varying `vancomycin` infusion-rate feature.

had_linezolid:
  name: Antibiotic exposure — Linezolid (any time during stay)
  type: demographic
  unit: bool
  value_range: [0, 1]
  tier: extended
  sofa_relevant: false
  availability:
    mimic_iii: not_available
    mimic_iv: not_available
    hirid: not_available
    eicu: not_available
    umm: available
  source_mapping:
    mimic_iii: null
    mimic_iv: null
    hirid: null
    eicu: null
    umm: demographics.had_linezolid


# ============================================================================
# DERIVED - SOFA COMPONENTS AND TOTAL
# ============================================================================
# Computed per hour using worst-of-last-24h per component (Singer 2016
# operationalization). Early-stay hours (t < 24) reflect partial windows.

sofa_cardiovascular:
  name: SOFA - Cardiovascular Component
  type: derived
  unit: points
  value_range: [0, 4]
  tier: core
  sofa_relevant: true
  availability:
    mimic_iii: derived
    mimic_iv: derived
    hirid: derived
    eicu: derived
    umm: derived
  source_mapping: null
  note: "Computation per Singer 2016:\n  0: MAP >= 70 mmHg, no vasopressors\n  1: MAP < 70 mmHg, no vasopressors\n\
    \  2: Dopamine <=5 OR Dobutamine (any)\n  3: Dopamine >5 OR Epinephrine <=0.1 OR Norepinephrine <=0.1\n\
    \  4: Dopamine >15 OR Epinephrine >0.1 OR Norepinephrine >0.1\nDoses in ug/kg/min. Highest applicable\
    \ score among active agents.\n"

sofa_cns:
  name: SOFA - Central Nervous System Component
  type: derived
  unit: points
  value_range: [0, 4]
  tier: core
  sofa_relevant: true
  availability:
    mimic_iii: derived
    mimic_iv: derived
    hirid: derived
    eicu: derived
    umm: derived
  source_mapping: null
  note: "Computation based on GCS total (sum of eye + motor + verbal):\n  0: GCS 15\n  1: GCS 13-14\n\
    \  2: GCS 10-12\n  3: GCS 6-9\n  4: GCS <6\nNo sedation adjustment (documented simplification). Values\
    \ as recorded.\n"

sofa_coagulation:
  name: SOFA - Coagulation Component
  type: derived
  unit: points
  value_range: [0, 4]
  tier: core
  sofa_relevant: true
  availability:
    mimic_iii: derived
    mimic_iv: derived
    hirid: derived
    eicu: derived
    umm: derived
  source_mapping: null
  note: "Computation based on platelets (10^9/L):\n  0: >=150\n  1: <150\n  2: <100\n  3: <50\n  4: <20\n"

sofa_liver:
  name: SOFA - Liver Component
  type: derived
  unit: points
  value_range: [0, 4]
  tier: core
  sofa_relevant: true
  availability:
    mimic_iii: derived
    mimic_iv: derived
    hirid: derived
    eicu: derived
    umm: derived
  source_mapping: null
  note: "Computation based on total bilirubin (mg/dL):\n  0: <1.2\n  1: 1.2-1.9\n  2: 2.0-5.9\n  3: 6.0-11.9\n\
    \  4: >=12.0\n"

sofa_renal:
  name: SOFA - Renal Component
  type: derived
  unit: points
  value_range: [0, 4]
  tier: core
  sofa_relevant: true
  availability:
    mimic_iii: derived
    mimic_iv: derived
    hirid: derived
    eicu: derived
    umm: derived
  source_mapping: null
  note: "Computation based on creatinine (mg/dL) OR 24h urine output (mL), max score:\n  Creatinine: 0:<1.2,\
    \ 1:1.2-1.9, 2:2.0-3.4, 3:3.5-4.9, 4:>=5.0\n  Urine/24h:  3: <500 mL, 4: <200 mL\nDialysis override\
    \ (if active RRT): automatic 4.\nUrine aggregated over trailing 24h; data stores hourly urine separately.\n"

sofa_respiratory:
  name: SOFA - Respiratory Component
  type: derived
  unit: points
  value_range: [0, 4]
  tier: core
  sofa_relevant: true
  availability:
    mimic_iii: derived
    mimic_iv: derived
    hirid: derived
    eicu: derived
    umm: derived
  source_mapping: null
  note: "Computation based on P/F ratio (PaO2/FiO2):\n  0: >=400\n  1: <400\n  2: <300\n  3: <200 AND\
    \ mechanically ventilated\n  4: <100 AND mechanically ventilated\nIf not mechanically ventilated,\
    \ max score is 2 regardless of P/F.\n"

sofa_total:
  name: SOFA Total Score
  type: derived
  unit: points
  value_range: [0, 24]
  tier: core
  sofa_relevant: true
  availability:
    mimic_iii: derived
    mimic_iv: derived
    hirid: derived
    eicu: derived
    umm: derived
  source_mapping: null
  note: Sum of 6 components. Range 0-24.


# ============================================================================
# DERIVED - OTHER HELPERS
# ============================================================================

gcs_total:
  name: Glasgow Coma Scale - Total
  type: derived
  unit: points
  value_range: [3, 15]
  tier: core
  sofa_relevant: true
  availability:
    mimic_iii: derived
    mimic_iv: derived
    hirid: derived
    eicu: derived
    umm: available
  source_mapping:
    mimic_iii: null
    mimic_iv: null
    hirid: null
    eicu: null
    umm: v_gcs_total
  note: >
    Sum of gcs_eye + gcs_motor + gcs_verbal. Range 3-15. For MIMIC/HiRID/eICU,
    computed in Step 2 from components when all three are available in the
    same hour. UMM charts gcs_total directly (nurse-entered composite).

mortality_icu:
  name: ICU Mortality
  type: outcome
  unit: bool
  value_range: [0, 1]
  tier: core
  sofa_relevant: false
  availability:
    mimic_iii: available
    mimic_iv: available
    hirid: available
    eicu: available
    umm: available
  source_mapping:
    mimic_iii: DEATHTIME within [intime, outtime+1h]
    mimic_iv: deathtime within [intime, outtime+1h]
    hirid: general_table.discharge_status == "dead"
    eicu: patient.unitdischargestatus == "Expired"
    umm: death_time within [icu_start, icu_end+1h]
  note: 'TRUE ICU mortality (death during the ICU stay), consistent across all 5 datasets. Approx rates: MIMIC-III 7.4%, MIMIC-IV 7.5%, eICU 5.2%, HiRID 6.1%, UMM 19.4%. NOTE: MIMIC-III/IV and UMM previously used hospital/all-cause flags (mislabelled); corrected 2026-05-31. Binary, stored at hour=0.'

mortality_hospital:
  name: Hospital Mortality
  type: outcome
  unit: bool
  value_range: [0, 1]
  tier: extended
  sofa_relevant: false
  availability:
    mimic_iii: available
    mimic_iv: available
    hirid: not_available
    eicu: available
    umm: available
  source_mapping:
    mimic_iii: admissions.HOSPITAL_EXPIRE_FLAG
    mimic_iv: admissions.hospital_expire_flag
    hirid: null
    eicu: patient.hospitaldischargestatus == "Expired"
    umm: deceased flag (all-cause; death_time may be weeks post-ICU-discharge)
  note: 'In-hospital / all-cause death. Approx rates: MIMIC-III 11.0%, MIMIC-IV 11.9%, eICU 9.0%, UMM 27.2% (all-cause, incl. deaths up to ~56d post-ICU). HiRID is ICU-only (no hospital outcome). Additional flag alongside mortality_icu for severity benchmarking.'

pf_ratio:
  name: PaO2/FiO2 Ratio (Horowitz index)
  type: derived
  unit: mmHg
  value_range: [0, 800]
  tier: extended
  sofa_relevant: true
  availability:
    mimic_iii: derived
    mimic_iv: derived
    hirid: derived
    eicu: derived
    umm: derived
  source_mapping: null
  note: PaO2 (mmHg) / FiO2 (fraction). Used in SOFA-respiratory. Computed only when both inputs are within
    same aggregation bin.



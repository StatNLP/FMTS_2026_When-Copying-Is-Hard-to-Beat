# ============================================================================
# ICU Feature Catalog - Cross-Database Harmonization
# ============================================================================
# Datasets: MIMIC-III, MIMIC-IV, HiRID, eICU, UMM
#
# Structure per feature:
#   name:             Human-readable label
#   type:             vital | lab | ventilation | medication | fluid
#                     | demographic | derived
#   unit:             Harmonized unit
#   value_range:      [min, max] plausible value range for outlier detection.
#                     Values outside this range are set to NaN during extraction.
#                     null for non-numeric features (booleans, categoricals).
#                     Sources: Paper 2 (01_preprocess_mimic.py) where available,
#                     clinically plausible bounds otherwise, definition-based
#                     for derived features (SOFA etc.).
#   tier:             core | extended | dataset_specific
#   sofa_relevant:    Used in SOFA computation (bool)
#   availability:     theoretical per-dataset label (available | sparse
#                     | partial_period | not_available). Must be consistent
#                     with source_mapping: empty/null mapping => not_available.
#   source_mapping:   dataset-specific identifier (itemid, column, variableid)
#   conversion:       unit conversion notes, if needed
#   note:             additional context
#
# Outlier handling rule:
#   During extraction (Step 1), values outside value_range are set to NaN
#   (NOT imputed to median, NOT dropped as rows). Consistent NaN convention
#   across all feature categories. Downstream imputation happens in Step 2.
#   Pre/post filter row counts are logged per variable.
#
# Empirical coverage:
#   Per-dataset sample coverage is no longer stored here. It lives as a
#   timestamped snapshot in data/tables/stage1_feature_coverage.csv after
#   each Stage-1 pipeline run.
#
# Inclusion rule for cross-DB experiments:
#   Variable must have >=3% sample coverage in TRAINSET of every participating
#   dataset (see data/tables/stage1_feature_coverage.csv). Exceptions:
#   SOFA-relevant variables are kept regardless.
#
# Sort order: by category, then alphabetical within category.
# ============================================================================



